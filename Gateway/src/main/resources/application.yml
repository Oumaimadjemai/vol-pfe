server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth-service/**
          filters:
            - StripPrefix=1
        - id: ms-destination
          uri: lb://MS-DESTINATION
          predicates:
            - Path=/ms-destination/**
          filters:
            - StripPrefix=1
        - id: service-vols
          uri: lb://service-vols
          predicates:
            - Path=/service-vols/**
          filters:
            - StripPrefix=1
        - id: ms-reservation
          uri: lb://MS-RESERVATION
          predicates:
            - Path=/ms-reservation/**
          filters:
            - StripPrefix=1
        - id: ms-paiement
          uri: lb://MS-PAIEMENT
          predicates:
            - Path=/ms-paiement/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://registry:8888/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: gateway
    prefer-ip-address: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG